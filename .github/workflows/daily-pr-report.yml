name: Daily PR Report

on:
  schedule:
    - cron: '0 8 * * 1-5'   # Weekdays at 8:00 AM UTC
  workflow_dispatch:
    inputs:
      use_llm:
        description: 'Generate LLM report in addition to basic report'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  pull-requests: read

jobs:
  basic-report:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_OWNER: ROCm
      REPO_NAME: rocm-systems
      PR_LABEL: "project: rocprofiler-systems"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate PR Report (basic)
        run: python scripts/fetch_and_report.py

      - name: Clean up reports older than 10 days
        run: |
          find reports/ -name '*-report-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].md' \
            -mtime +10 -delete -print || true

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "chore: daily basic PR report $(date +'%Y-%m-%d')"
          git push

  llm-report:
    if: inputs.use_llm != 'false'
    needs: basic-report
    runs-on: [self-hosted, amd-network]

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_OWNER: ROCm
      REPO_NAME: rocm-systems
      PR_LABEL: "project: rocprofiler-systems"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      AMD_LLM_GATEWAY_KEY: ${{ secrets.AMD_LLM_GATEWAY_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'Claude-Sonnet-4.6' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest (get basic report commit)
        run: git pull origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate PR Report (LLM)
        run: python scripts/generate_llm_report.py

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "chore: daily LLM PR report $(date +'%Y-%m-%d')"
          git push
