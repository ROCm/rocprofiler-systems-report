  #         git push

  llm-report:
    runs-on: [self-hosted, amd-network]

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_OWNER: ROCm
      REPO_NAME: rocm-systems
      PR_LABEL: "project: rocprofiler-systems"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      AMD_LLM_GATEWAY_KEY: ${{ secrets.AMD_LLM_GATEWAY_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'Claude-Sonnet-4.6' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate PR Report (LLM)
        run: python scripts/generate_llm_report.py

      - name: Convert report to HTML for GitHub Pages
        run: |
          python scripts/md_to_html.py \
            reports/llm-pr-report-latest.md \
            docs/reports/llm-pr-report-latest.html
          today=$(date -u +'%Y-%m-%d')
          python scripts/md_to_html.py \
            reports/llm-pr-report-latest.md \
            "docs/reports/llm-pr-report-${today}.html"

      - name: Clean up reports older than 10 days
        run: |
          cutoff=$(date -d '-10 days' '+%Y-%m-%d')
          for f in reports/*-report-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].md \
                   docs/reports/*-report-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].html; do
            [ -f "$f" ] || continue
            fdate=$(echo "$f" | grep -oP '\d{4}-\d{2}-\d{2}')
            if [ "$fdate" \< "$cutoff" ]; then
              echo "Deleting: $f (date: $fdate, cutoff: $cutoff)"
              rm "$f"
            fi
          done

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ docs/
          git diff --staged --quiet || git commit -m "chore: daily LLM PR report $(date +'%Y-%m-%d')"
          git push
