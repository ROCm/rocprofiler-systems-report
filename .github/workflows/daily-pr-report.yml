name: Daily PR Report

on:
  schedule:
    - cron: '0 8 * * *'   # Every day at 8:00 AM UTC
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write
  pull-requests: read

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk @octokit/rest

      - name: Test AMD gateway connectivity
        run: |
          curl -v https://llm-api.amd.com/Anthropic \
            -H "Ocp-Apim-Subscription-Key: ${{ secrets.AMD_LLM_GATEWAY_KEY }}" \
            --max-time 10 || echo "Connection failed"

      - name: Generate PR Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          AMD_LLM_GATEWAY_KEY: ${{ secrets.AMD_LLM_GATEWAY_KEY }}
          REPO_OWNER: ROCm
          REPO_NAME: rocm-systems
          PR_LABEL: "project: rocprofiler-systems"
        run: node scripts/generate-pr-report.js

      - name: Commit and push report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "chore: daily PR report $(date +'%Y-%m-%d')"
          git push
