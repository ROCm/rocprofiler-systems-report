name: Daily PR Report

on:
  schedule:
    - cron: '0 8 * * 1-5'   # Weekdays at 8:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  llm-report:
    runs-on: [self-hosted, amd-network]

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "project: rocprofiler-systems"
            prefix: "rocprofiler-systems"
          - label: "project: rocprofiler-compute"
            prefix: "rocprofiler-compute"

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_OWNER: ROCm
      REPO_NAME: rocm-systems
      PR_LABEL: ${{ matrix.label }}
      REPORT_PREFIX: ${{ matrix.prefix }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      AMD_LLM_GATEWAY_KEY: ${{ secrets.AMD_LLM_GATEWAY_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'Claude-Sonnet-4.6' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate PR Report (LLM)
        run: python scripts/generate_llm_report.py

      - name: Convert report to HTML for GitHub Pages
        run: |
          python scripts/md_to_html.py \
            "reports/${REPORT_PREFIX}-latest.md" \
            "docs/reports/${REPORT_PREFIX}-latest.html"
          today=$(date -u +'%Y-%m-%d')
          python scripts/md_to_html.py \
            "reports/${REPORT_PREFIX}-latest.md" \
            "docs/reports/${REPORT_PREFIX}-${today}.html"

      - name: Clean up reports older than 10 days
        run: |
          cutoff=$(date -d '-10 days' '+%Y-%m-%d')
          for f in reports/*-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].md \
                   docs/reports/*-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].html; do
            [ -f "$f" ] || continue
            fdate=$(echo "$f" | grep -oP '\d{4}-\d{2}-\d{2}')
            if [ "$fdate" \< "$cutoff" ]; then
              echo "Deleting: $f (date: $fdate, cutoff: $cutoff)"
              rm "$f"
            fi
          done

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ docs/
          git diff --staged --quiet || git commit -m "chore: daily ${REPORT_PREFIX} PR report $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
