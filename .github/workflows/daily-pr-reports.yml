name: Daily PR Reports

on:
  schedule:
    - cron: '0 8 * * 1-5'   # Weekdays at 8:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write   # needed for gh-pages deployment
  pull-requests: read

concurrency:
  group: daily-pr-report
  cancel-in-progress: true

jobs:
  llm-report:
    runs-on: [self-hosted, amd-network]

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "project: rocprofiler-systems"
            prefix: "rocprofiler-systems"
          - label: "project: rocprofiler-compute"
            prefix: "rocprofiler-compute"

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_OWNER: ROCm
      REPO_NAME: rocm-systems

      PR_LABEL: ${{ matrix.label }}
      REPORT_PREFIX: ${{ matrix.prefix }}

      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      AMD_LLM_GATEWAY_KEY: ${{ secrets.AMD_LLM_GATEWAY_KEY }}
      LLM_MODEL: Claude-Sonnet-4.6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate PR Report (LLM)
        run: python scripts/generate_llm_report.py

      - name: Convert report to HTML for GitHub Pages
        run: |
          mkdir -p docs/reports

          python scripts/md_to_html.py \
            "reports/${REPORT_PREFIX}-latest.md" \
            "docs/reports/${REPORT_PREFIX}-latest.html"

          today=$(date -u +'%Y-%m-%d')

          python scripts/md_to_html.py \
            "reports/${REPORT_PREFIX}-latest.md" \
            "docs/reports/${REPORT_PREFIX}-${today}.html"

      - name: Upload artifacts for publishing
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.prefix }}
          path: docs/reports/${{ matrix.prefix }}-*.html

  publish:
    needs: llm-report
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare GitHub Pages content
        run: |
          mkdir -p public/reports

          # skip Jekyll processing
          touch public/.nojekyll

          # copy static UI (index.html, dashboard pages)
          cp docs/*.html public/ || true

          # copy fresh report HTML files from artifacts
          find artifacts -type f -name "*.html" -exec cp -v {} public/reports/ \;

          echo "=== Final public/ ==="
          find public -type f

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public