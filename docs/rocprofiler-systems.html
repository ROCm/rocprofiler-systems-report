<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rocprofiler-systems — PR Report Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --border: #30363d;
    --card: #161b22;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.7;
  }
  .header {
    padding: 1rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1.5rem;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .back { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
  .back:hover { color: var(--accent); }
  h1 { font-size: 1.3rem; }
  .open-link {
    margin-left: auto;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.85rem;
    border: 1px solid var(--border);
    padding: 0.3rem 0.8rem;
    border-radius: 6px;
  }
  .open-link:hover { border-color: var(--accent); }
  #report-container {
    padding: 0;
  }
  .loading {
    text-align: center;
    padding: 3rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="header">
    <a class="back" href="index.html">← Dashboards</a>
    <h1>rocprofiler-systems</h1>
    <a class="open-link" href="reports/rocprofiler-systems-latest.html" target="_blank">Open in new tab</a>
  </div>
  <div id="report-container">
    <p class="loading">Loading report...</p>
  </div>
  <script>
    fetch('reports/rocprofiler-systems-latest.html')
      .then(r => r.text())
      .then(html => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const body = doc.querySelector('body');
        const style = doc.querySelector('style');
        const container = document.getElementById('report-container');
        if (style) {
          const wrapper = document.createElement('div');
          const shadowRoot = wrapper.attachShadow({ mode: 'open' });
          shadowRoot.innerHTML = '<style>' + style.textContent + '</style>' + body.innerHTML;
          container.innerHTML = '';
          container.appendChild(wrapper);
        } else {
          container.innerHTML = body ? body.innerHTML : html;
        }
      })
      .catch(() => {
        document.getElementById('report-container').innerHTML =
          '<p class="loading">Report not available yet. Run the workflow to generate it.</p>';
      });
  </script>
</body>
</html>
